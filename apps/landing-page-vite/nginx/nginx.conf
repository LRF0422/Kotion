
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;
    client_max_body_size 500m;
    #gzip  on;

    # ---------------------------------------------------------------
    # SEO / 软 404（见 docs/OPERATIONS_PLAN.md P1-2）
    #
    # `node scripts/prerender.mjs` 会为路由白名单产出 `dist/<route>/index.html`
    # 与 `dist/404.html`。下面用正则 location 把「白名单路由」和「未知路径」
    # 分开：
    #   * 白名单路由 → 命中预渲染出的静态 HTML（200，含独立 title/canonical）；
    #   * 未知路径   → error_page 404 → 返回 404 状态 + SPA 外壳，
    #                 前端 NotFound 页负责展示（爬虫看到真正的 404）。
    # 白名单必须与 scripts/prerender.mjs 的 ROUTES 保持一致。
    # ---------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default          keep-alive;
        'websocket'      upgrade;
    }

    server {
        listen       889 ssl;
        server_name  www.simple-platform.cn;
        root   /usr/share/nginx/html;
        ssl_certificate  /usr/share/nginx/kotion.top.pem;
        ssl_certificate_key /usr/share/nginx/kotion.top.key;

        # 首页（无前缀与 /zh、/en）
        location ~ ^/(zh|en)?/?$ {
            try_files /index.html =404;
        }

        # 预渲染的静态路由
        location ~ ^/(zh|en)?/(templates|plugins|doc|changelog|unsubscribe|confirm)(/.*)?$ {
            try_files /index.html =404;
        }

        # 投放页 /c/<slug>
        location ~ ^/(zh|en)?/c/[^/]+/?$ {
            try_files /index.html =404;
        }

        # 站点地图与爬虫协议由构建产物提供
        location = /sitemap.xml {
            types { }
            default_type application/xml;
            try_files /sitemap.xml =404;
        }

        location = /robots.txt {
            types { }
            default_type text/plain;
            try_files /robots.txt =404;
        }

        location = /404.html {
            internal;
        }

        location /api {
              charset UTF-8;
              proxy_set_header   Host             $host;
              proxy_set_header  X-Real-IP  $remote_addr;
              proxy_set_header X-Forwarded-For $http_x_forwarded_for;
              proxy_connect_timeout   3;
              proxy_send_timeout      3600;
              proxy_read_timeout      3600;
              proxy_pass http://192.168.3.43:88;
              rewrite ^/api/(.*)$ /$1 break;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
            }

        # 静态资源：命中即返回，未命中给出真实 404（不再回落到 index.html）
        location / {
            index  index.html index.htm index;
            try_files $uri =404;
        }

        # 未知路径 → 404 状态 + SPA 外壳，前端渲染 NotFound
        error_page 404 /404.html;

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

    }

    server {
            listen       80;
            server_name  localhost;

            root   /usr/share/nginx/html;

            location ~ ^/(zh|en)?/?$ {
                try_files /index.html =404;
            }

            location ~ ^/(zh|en)?/(templates|plugins|doc|changelog|unsubscribe|confirm)(/.*)?$ {
                try_files /index.html =404;
            }

            location ~ ^/(zh|en)?/c/[^/]+/?$ {
                try_files /index.html =404;
            }

            location = /sitemap.xml {
                types { }
                default_type application/xml;
                try_files /sitemap.xml =404;
            }

            location = /robots.txt {
                types { }
                default_type text/plain;
                try_files /robots.txt =404;
            }

            location = /404.html {
                internal;
            }

            location /api {
                  charset UTF-8;
                  proxy_set_header   Host             $host;
                  proxy_set_header  X-Real-IP  $remote_addr;
                  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
                  proxy_connect_timeout   3;
                  proxy_send_timeout      3600;
                  proxy_read_timeout      3600;
                  proxy_pass http://192.168.3.43:88;
                  rewrite ^/api/(.*)$ /$1 break;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                }

            location / {
                index  index.html index.htm index;
                try_files $uri =404;
            }

            error_page 404 /404.html;

            error_page   500 502 503 504  /50x.html;
            location = /50x.html {
                root   /usr/share/nginx/html;
            }

        }
}
