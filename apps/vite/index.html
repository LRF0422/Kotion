<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>KN</title>
  <script>
    // Apply the saved theme/language immediately to prevent a flash. The boot
    // splash (injected by `bootSplashPlugin`) keys its copy and colours off
    // `html.dark` / `html[lang]`, so this has to run before the body parses.
    (function () {
      const root = document.documentElement;
      const theme = localStorage.getItem('kn-ui-theme') || localStorage.getItem('theme');
      const uiStyle = localStorage.getItem('kn-ui-style');
      root.dataset.uiStyle = uiStyle === 'modern' ? 'modern' : 'classic';
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.classList.add('dark');
      }
      const language = localStorage.getItem('language') || navigator.language || 'en';
      root.lang = /^zh/i.test(language) ? 'zh' : 'en';
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    var process = {
      env: {
        NODE_ENV: 'production'
      }
    };
  </script>
</body>

</html>
