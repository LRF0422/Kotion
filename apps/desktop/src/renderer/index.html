<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KN</title>
    <script>
        // Apply saved theme immediately to prevent flash
        (function () {
            const theme = localStorage.getItem('kn-ui-theme') || localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        /* Prevent white flash on load */
        html {
            background-color: hsl(0 0% 100%);
        }

        html.dark {
            background-color: hsl(240 10% 3.9%);
        }

        /* Static loading indicator — visible before React mounts */
        #root:empty {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        #root:empty::after {
            content: 'KN';
            font-size: 60px;
            font-weight: bold;
            color: hsl(240 5.9% 10%);
            animation: pulse 1.5s ease-in-out infinite;
        }

        html.dark #root:empty::after {
            color: hsl(0 0% 98%);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
        var process = {
            env: {
                NODE_ENV: 'production'
            }
        };
    </script>
</body>

</html>
