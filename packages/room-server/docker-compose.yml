version: '3.8'

services:
  # Nginx reverse proxy for HTTPS/SSL termination
  nginx:
    image: nginx:alpine
    container_name: room-server-nginx
    ports:
      - "8877:8877"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # Mount SSL certificates
      - ./nginx/kotion.top.pem:/usr/share/nginx/kotion.top.pem
      - ./nginx/kotion.top.key:/usr/share/nginx/kotion.top.key
    restart: unless-stopped
    networks:
      - room-network

  # Room server (Hocuspocus WebSocket server)
  room-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: room-server
    environment:
      - PORT=1234
      - NODE_ENV=production
      - SSL_ENABLED=false  # SSL is handled by nginx
      # Persistence: without DB_HOST the Y.Doc is in-memory only and data stored
      # beside the document (spreadsheet L3 sheets) is lost on restart.
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_DATABASE=${DB_DATABASE:-knowledge_wiki}
      - DB_TABLE=${DB_TABLE:-collab_documents}
      - STORE_DEBOUNCE_MS=${STORE_DEBOUNCE_MS:-2000}
      - STORE_MAX_DEBOUNCE_MS=${STORE_MAX_DEBOUNCE_MS:-10000}
      - AUTH_API_BASE_URL=${AUTH_API_BASE_URL:-}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-6379}
    # Internal port, not exposed to host
    expose:
      - "1234"
    restart: unless-stopped
    networks:
      - room-network

networks:
  room-network:
    driver: bridge
