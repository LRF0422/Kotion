server:
  port: 7780

agent:
  # LLM provider selection (consumed by LlmClientFactory; providers map
  # usually supplied via Nacos / environment config)
  default-provider: deepseek
  default-model: deepseek-chat
  # ---- V2 engine (AgentProperties) ----
  engine:
    max-iterations: 20
    streaming-enabled: true
    max-delegate-depth: 2
    delegate-timeout-seconds: 600
  llm:
    timeout-seconds: 120
    max-retries: 3
    idle-timeout-seconds: 30
  tool:
    timeout-seconds: 180
    max-parallel: 5
  orchestrator:
    enabled: false
  context:
    max-context-tokens: 60000
    compaction-threshold: 0.75
    keep-recent-messages: 8
    tool-result-max-chars: 8000
    evict-tool-results-after-iterations: 3
  state:
    backend: jdbc
    snapshot-interval: 5
  rate-limit:
    enabled: true
    requests-per-minute: 60
  event-store:
    enabled: true
    max-events: 2000
    ttl-hours: 24
  skill:
    web-search:
      enabled: true
      provider: tavily
      api-url: https://api.tavily.com/search
      api-key: ${TAVILY_API_KEY:}
      timeout-seconds: 10
      default-max-results: 5
      max-results-limit: 20
    web-fetch:
      timeout-seconds: 15
      max-content-length: 50000
    dataset-search:
      enabled: true
      provider: huggingface
      timeout-seconds: 15
      default-max-results: 5
      max-results-limit: 20
      huggingface:
        api-url: https://huggingface.co/api/datasets
      kaggle:
        api-url: https://www.kaggle.com/api/v1/datasets/list
        username: ${KAGGLE_USERNAME:}
        api-key: ${KAGGLE_KEY:}
      datagov:
        api-url: https://catalog.data.gov/api/3/action/package_search
