server:
  port: 7780

agent:
  # LLM provider selection (consumed by LlmClientFactory; providers map
  # usually supplied via Nacos / environment config)
  default-provider: deepseek
  default-model: deepseek-v4-flash
  # Vision (读图): before the agent sends image content to a model it checks
  # supportsVision. Mark a multimodal model with vision: true in its
  # agent.providers.<provider>.models[] entry (well-known names such as
  # glm-4v / *-vl / gpt-4o are also recognised). A non-vision model gets a
  # plain-text degradation instead of image parts (which providers would 400).
  #
  # ⚠️ The worst case is a model that DOES accept images but is not marked: the
  # chat panel accepts the upload, the backend then drops the image parts, and
  # the model answers "看不到图片" — with nothing in the UI explaining why.
  # `default-model` above must therefore be flagged in the provider map
  # (usually supplied by Nacos, not this file):
  #
  #   agent:
  #     providers:
  #       deepseek:
  #         base-url: https://<host>/v1
  #         api-key: ${DEEPSEEK_API_KEY:}
  #         models:
  #           - name: deepseek-v4-flash
  #             vision: true
  #
  # The name must match the id the client sends (or `default-model`). The
  # capability is published per model by /api/v1/models (supportsVision), which
  # the web client uses to badge vision models and to disable image upload for
  # the ones that cannot read images.
  # ---- AgentCore runtime (from-0 redesign; replaced the V2 engine config) ----
  run:
    # LLM turns allowed before the run suspends with reason "budget".
    max-steps: 100
    max-delegate-depth: 2
    delegate-timeout-seconds: 600
    waiting-tools-timeout-seconds: 600
  llm:
    timeout-seconds: 120
    idle-timeout-seconds: 30
    # Shared-provider protection. Every in-flight inference holds one provider
    # connection for the whole stream; with one loop thread per run an unguarded
    # fan-out of agents stampedes the provider and every call times out. The
    # gate bounds concurrent calls globally (0 = unlimited), optionally per
    # provider (e.g. "{deepseek: 8}"), and a caller that cannot get a slot within
    # acquire-timeout-seconds fails fast instead of queueing forever.
    max-concurrent-calls: 12
    provider-max-concurrent: {}
    acquire-timeout-seconds: 180
    # Retry 429 / 5xx / connect / timeout failures before any content arrived.
    max-attempts: 3
    retry-base-delay-ms: 500
    retry-max-delay-ms: 10000
  tool:
    timeout-seconds: 180
    max-parallel: 5
  context:
    max-context-tokens: 60000
    compaction-threshold: 0.75
    # Keep more of the window verbatim: the editor agent reads documents in
    # several chunks, and evicting read results after only 3 steps made the
    # model lose what it had just read and re-read it in a loop.
    keep-recent-messages: 16
    tool-result-max-chars: 12000
    evict-tool-results-after-steps: 10
    # Optional cheaper model for L2 summarization; empty = follow the run model.
    compaction-model:
    summary-max-tokens: 1024
    summary-prompt-max-chars: 20000
    # The injected deferred-tool directory is a constant prefix on every request,
    # so its per-tool description is capped (0 = keep only name + signature) and
    # signatures render at most this many parameters.
    deferred-tool-desc-limit: 0
    deferred-tool-param-limit: 8
    # Keep the provider tools[] array byte-stable for the whole conversation:
    # a deferred tool's schema rides back with its first result instead of
    # being merged into tools[] (which would reset the prefix cache). Set false
    # only if the provider rejects undeclared historical tool_calls.
    freeze-deferred-tools: true
  checkpoint:
    enabled: true
  event:
    ttl-hours: 24
    retention-days: 30
    max-events-per-run: 2000
  memory:
    enabled: true
    top-k: 5
    hot-ttl-days: 7
  # Derived low-sensitivity user profile (occupation / interests / preferences).
  # Ships OFF behind an opt-in: users must consent before anything is derived.
  # Sensitive attributes (gender, mental state, personality, ...) are never
  # inferred — see core/profile/ProfileSensitivity.
  profile:
    enabled: false
    model:            # empty = follow the triggering run's model
    max-transcript-chars: 24000
    max-output-tokens: 1024
    min-new-messages: 8
    inject-min-confidence: 55
    inject-top-k: 6
    inject-max-chars: 600
    evidence-retention-days: 90
    decay-cron: "0 30 3 * * ?"
    max-traits-per-user: 200
    max-evidence-per-trait: 20
    backfill-batch-size: 50
  saved-skills:
    enabled: true
    top-k: 3
    min-score: 0.30
    # 0.55: a trusted save request whose best-matching enabled skill scores at
    # least this value merges into that skill (version + 1). 1.0 disables merging.
    merge-score: 0.55
    candidate-limit: 100
    max-skills-per-user: 100
    max-transcript-chars: 24000
    max-message-chars: 4000
    max-tool-output-chars: 1500
    max-fragment-chars: 4000
    max-prompt-chars: 6000
    max-tool-names-per-skill: 16
    compile-max-tokens: 1200
    compile-model:
  remote-skill:
    enabled: true
    # A registering microservice is considered dead after this long without a
    # heartbeat and its tools are dropped from the model's tool list.
    stale-ms: 90000
    # Timeout for one remote skill invocation (seconds).
    call-timeout-seconds: 30
  quota:
    enabled: true
    create-per-minute: 30
    max-concurrent-per-tenant: 0  # 0 = unlimited concurrent tasks
  lease:
    ttl-seconds: 30
  skill:
    web-search:
      enabled: true
      provider: tavily
      api-url: https://api.tavily.com/search
      api-key: ${TAVILY_API_KEY:}
      timeout-seconds: 10
      default-max-results: 5
      max-results-limit: 20
    web-fetch:
      timeout-seconds: 15
      max-content-length: 50000
    # ---- kept until M3 removes the legacy consumer ----
    dataset-search:
      enabled: true
      provider: huggingface
      timeout-seconds: 15
      default-max-results: 5
      max-results-limit: 20
      huggingface:
        api-url: https://huggingface.co/api/datasets
      kaggle:
        api-url: https://www.kaggle.com/api/v1/datasets/list
        username: ${KAGGLE_USERNAME:}
        api-key: ${KAGGLE_KEY:}
      datagov:
        api-url: https://catalog.data.gov/api/3/action/package_search

# Service-to-service Agent SDK registration/heartbeat/unregister carries no user
# JWT, so these endpoints must bypass user authentication. The skill *invoke*
# callback is the opposite: it forwards the original user JWT and stays secured.
knowledge:
  secure:
    skip-url:
      - /api/v1/skills/**
  # Agent bodies are structured JSON whose *values* are arbitrary data: user
  # prompts, markdown, and tool results that may contain fetched source code,
  # HTML, `-->>`, `=>`, `<|--`, or `&`. The global XSS wrapper runs the whole
  # raw body through an HTML filter, which rewrites those characters and leaves
  # the body unparseable ("Unexpected character ... was expecting comma",
  # surfacing as a 400 on /runs/{id}/resume once a tool result is large enough).
  # Same precedent as knowledge-wiki's structured document endpoints: escaping
  # belongs at the render boundary, not on the wire.
  xss:
    skip-url:
      - /api/agent/**
