spring:
  datasource:
    url: ${blade.datasource.dev.url}
    username: ${blade.datasource.dev.username}
    password: ${blade.datasource.dev.password}

# Agent SDK Configuration
agent:
  sdk:
    enabled: true
  skill:
    web-resource:
      enabled: true
      # Search provider: tavily, duckduckgo, searxng, or custom
      provider: tavily
      # API URL (default: Tavily Search API)
      api-url: https://api.tavily.com/search
      # API key (required for some providers)
      api-key: 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
      # HTTP request timeout in seconds
      timeout-seconds: 15
      # Default max search results
      default-max-results: 5
      # Maximum allowed search results (cap)
      max-results-limit: 20
      # Maximum file size to download (50MB)
      max-download-size: 52428800
      # User-Agent for HTTP requests (realistic browser UA to avoid bot detection)
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    web-download:
      enabled: true
      # HTTP read timeout in seconds
      timeout-seconds: 30
      # HTTP connect timeout in seconds
      connect-timeout-seconds: 10
      # Maximum file size to download (100MB); enforced while streaming too
      max-download-size: 104857600
      # Whether to HEAD-check URL before downloading
      head-check-enabled: true
      # Maximum retries for transient HTTP errors (429, 5xx) and network failures
      retry-count: 3
      # Maximum HTTP redirects to follow (every hop is SSRF-checked)
      max-redirects: 5
      # Reject loopback/private/CGNAT/link-local/ULA targets (SSRF protection)
      block-private-addresses: true
      # Hosts that bypass the private-address block (exact, .suffix or *.suffix)
      allowed-hosts: []
      # Maximum stored filename length
      max-file-name-length: 200
      # Rotate realistic browser User-Agents between requests/attempts
      user-agent-rotation: true
      # Default User-Agent (used when rotation is disabled)
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
