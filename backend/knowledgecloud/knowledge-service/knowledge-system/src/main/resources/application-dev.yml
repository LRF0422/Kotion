#服务器端口
server:
  port: 8106

#数据源配置
spring:
  datasource:
    url: ${blade.datasource.dev.url}
    username: ${blade.datasource.dev.username}
    password: ${blade.datasource.dev.password}
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

casbin:
  auto-save: true
  enable-casbin: true
  enable-watcher: true
  store-type: jdbc
  watcher-type: redis

knowledge:
  rocketmq:
    enable: true
    producer:
      namesrvAddr: 192.168.3.43:9876
      groupName: knowledge
    consumer:
      namesrvAddr: 192.168.3.43:9876
      groupName: knowledge

