# 业务消息（默认语言：简体中文）
#
# key 与 com.knowledge.wiki.service.exception.WikiException 一一对应；
# 英文文案见 messages_en.properties，解析不到时会回退到这里的默认 bundle。
# 前端通过 Accept-Language 传当前界面语言（见 packages/common/src/utils/request.tsx）。
# 文案中的 {} 占位符由 BusinessException 在抛出异常时按变量顺序填充。

