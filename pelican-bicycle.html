<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1200px 700px at 50% -5%,#31405c 0%,#161f2f 55%,#0a0e18 100%);
    font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#e8eef7;
  }
  .wrap{width:min(1000px,100%)}
  .card{
    border-radius:26px;overflow:hidden;line-height:0;
    box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.09);
    background:#cfeaf9;
  }
  .card svg{display:block;width:100%;height:auto}
  .hint{
    display:flex;align-items:center;gap:8px;margin-top:16px;
    font-size:12.5px;letter-spacing:.09em;color:#8ea1bd;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;background:#5ee0a6;
    box-shadow:0 0 10px #5ee0a6;flex:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <svg id="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="一只鹈鹕骑着红色自行车沿着公路前进的二维循环动画">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#a9ddf7"/>
          <stop offset="45%"  stop-color="#d9f0fb"/>
          <stop offset="78%"  stop-color="#f6f2e2"/>
          <stop offset="100%" stop-color="#fdf2d8"/>
        </linearGradient>
        <radialGradient id="sunGlow">
          <stop offset="0%"   stop-color="#ffe9a8" stop-opacity=".95"/>
          <stop offset="45%"  stop-color="#ffe08a" stop-opacity=".32"/>
          <stop offset="100%" stop-color="#ffe08a" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#7c8798"/>
          <stop offset="18%"  stop-color="#66717f"/>
          <stop offset="100%" stop-color="#39424e"/>
        </linearGradient>
        <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#c3e3d4"/>
          <stop offset="100%" stop-color="#a6d0bd"/>
        </linearGradient>
        <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#9fd4b5"/>
          <stop offset="100%" stop-color="#7cbd9b"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0.15" y1="0" x2="0.4" y2="1">
          <stop offset="0%"   stop-color="#ffffff"/>
          <stop offset="55%"  stop-color="#fbf7ee"/>
          <stop offset="100%" stop-color="#e7dfce"/>
        </linearGradient>
        <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#ffc464"/>
          <stop offset="100%" stop-color="#f2962e"/>
        </linearGradient>
        <linearGradient id="pouchGrad" x1="0" y1="0" x2="0.25" y2="1">
          <stop offset="0%"   stop-color="#ffdca6"/>
          <stop offset="100%" stop-color="#f6bd6b"/>
        </linearGradient>
        <filter id="shadowBlur" x="-30%" y="-120%" width="160%" height="340%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
      </defs>

      <!-- ============ 天空 / 太阳 ============ -->
      <rect x="0" y="0" width="900" height="520" fill="url(#skyGrad)"/>
      <g id="sun">
        <circle cx="748" cy="104" r="150" fill="url(#sunGlow)"/>
        <circle cx="748" cy="104" r="44" fill="#ffe9a6"/>
        <circle cx="748" cy="104" r="44" fill="none" stroke="#ffd968" stroke-width="3" opacity=".7"/>
      </g>

      <!-- ============ 云 ============ -->
      <g id="clouds" fill="#ffffff" opacity=".92"></g>

      <!-- ============ 远山 / 近山 ============ -->
      <path fill="url(#hillFar)"
            d="M0 432 L0 372 C60 340 120 330 180 356 C230 376 262 384 302 372
               C352 358 400 330 460 344 C520 358 560 380 620 372
               C680 364 720 340 780 348 C830 354 872 372 900 364 L900 432 Z"/>
      <path fill="url(#hillNear)"
            d="M0 432 L0 398 C50 384 100 388 150 402 C200 416 242 420 300 408
               C360 396 400 392 470 404 C540 416 590 412 650 400
               C710 388 752 394 810 406 C852 414 882 416 900 410 L900 432 Z"/>

      <!-- ============ 路边灌木 ============ -->
      <g id="bushes"></g>

      <!-- ============ 公路 ============ -->
      <rect x="0" y="432" width="900" height="88" fill="url(#roadGrad)"/>
      <rect x="0" y="432" width="900" height="3" fill="#eef3fa" opacity=".5"/>
      <g id="dashes"></g>

      <!-- ============ 地面投影 ============ -->
      <ellipse cx="444" cy="440" rx="208" ry="15" fill="#101820" opacity=".28" filter="url(#shadowBlur)"/>

      <!-- ============ 自行车 + 鹈鹕 ============ -->
      <g id="bike">

        <!-- ---------- 后轮 ---------- -->
        <g transform="translate(300 362)">
          <g id="spinRear">
            <circle r="70" fill="none" stroke="#242a33" stroke-width="10"/>
            <circle r="61" fill="none" stroke="#cdd6e0" stroke-width="3"/>
            <g stroke="#aab6c6" stroke-width="1.5">
              <line x1="-59" y1="0" x2="59" y2="0"/>
              <line x1="0" y1="-59" x2="0" y2="59"/>
              <line x1="-51" y1="-29.5" x2="51" y2="29.5"/>
              <line x1="-51" y1="29.5" x2="51" y2="-29.5"/>
              <line x1="-29.5" y1="-51" x2="29.5" y2="51"/>
              <line x1="-29.5" y1="51" x2="29.5" y2="-51"/>
            </g>
            <rect x="-2" y="-58" width="4" height="10" rx="2" fill="#f0a63c"/>
            <circle r="7" fill="#cdd6e0"/>
            <circle r="3" fill="#7d8794"/>
          </g>
        </g>

        <!-- ---------- 前轮 ---------- -->
        <g transform="translate(580 362)">
          <g id="spinFront">
            <circle r="70" fill="none" stroke="#242a33" stroke-width="10"/>
            <circle r="61" fill="none" stroke="#cdd6e0" stroke-width="3"/>
            <g stroke="#aab6c6" stroke-width="1.5">
              <line x1="-59" y1="0" x2="59" y2="0"/>
              <line x1="0" y1="-59" x2="0" y2="59"/>
              <line x1="-51" y1="-29.5" x2="51" y2="29.5"/>
              <line x1="-51" y1="29.5" x2="51" y2="-29.5"/>
              <line x1="-29.5" y1="-51" x2="29.5" y2="51"/>
              <line x1="-29.5" y1="51" x2="29.5" y2="-51"/>
            </g>
            <rect x="-2" y="-58" width="4" height="10" rx="2" fill="#f0a63c"/>
            <circle r="7" fill="#cdd6e0"/>
            <circle r="3" fill="#7d8794"/>
          </g>
        </g>

        <!-- ---------- 远侧曲柄 ---------- -->
        <g id="crankFar" transform="translate(420 366) rotate(180)">
          <line x1="0" y1="0" x2="28" y2="0" stroke="#6f7987" stroke-width="7" stroke-linecap="round"/>
          <g id="pedalFar" transform="translate(28 0) rotate(-180)">
            <rect x="-14" y="-4.5" width="28" height="9" rx="3.5" fill="#2b323b"/>
          </g>
        </g>

        <!-- ---------- 远侧腿 ---------- -->
        <g>
          <path id="lftThighO" fill="none" stroke="#a8631f" stroke-width="30"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path id="lfsShinO"  fill="none" stroke="#a8631f" stroke-width="17"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path id="lftThighI" fill="none" stroke="#d18b37" stroke-width="25"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path id="lfsShinI"  fill="none" stroke="#d18b37" stroke-width="12"
                stroke-linecap="round" stroke-linejoin="round"/>
          <g id="footFar">
            <path d="M-15 2 C-14 -7 13 -8 16 2 C16 8 -8 9 -15 2 Z"
                  fill="#d18b37" stroke="#a8631f" stroke-width="1.8" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- ---------- 车架 ---------- -->
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <!-- 链条 -->
          <path d="M420 348 L300 353 M420 384 L300 371" stroke="#8e99a7" stroke-width="3"/>
          <circle cx="300" cy="362" r="9" fill="none" stroke="#b9c3ce" stroke-width="3"/>
          <!-- 车架描边 -->
          <path d="M300 362 L420 366 M300 362 L378 268 M378 268 L420 366 M378 268 L545 252
                   M420 366 L557 318 M545 252 L557 318 M557 318 L580 362"
                stroke="#a83730" stroke-width="14"/>
          <!-- 车架上色 -->
          <path d="M300 362 L420 366 M300 362 L378 268 M378 268 L420 366 M378 268 L545 252
                   M420 366 L557 318 M545 252 L557 318 M557 318 L580 362"
                stroke="#e2574c" stroke-width="9"/>
          <!-- 牙盘 -->
          <circle cx="420" cy="366" r="18" fill="none" stroke="#b9c3ce" stroke-width="4"/>
        </g>

        <!-- ---------- 车把 ---------- -->
        <g fill="none" stroke-linecap="round">
          <path d="M545 252 L547 230" stroke="#a83730" stroke-width="12"/>
          <path d="M545 252 L547 230" stroke="#e2574c" stroke-width="8"/>
          <path d="M514 240 C530 228 566 226 584 238" stroke="#a83730" stroke-width="11"/>
          <path d="M514 240 C530 228 566 226 584 238" stroke="#e2574c" stroke-width="7"/>
          <path d="M514 240 C521 235 527 231 533 229" stroke="#333b46" stroke-width="13"/>
          <path d="M584 238 C577 235 571 231 565 229" stroke="#333b46" stroke-width="13"/>
        </g>

        <!-- ---------- 车座 ---------- -->
        <path d="M344 272 C350 260 388 256 404 262 C414 266 412 276 398 277 L352 279
                 C342 279 340 276 344 272 Z" fill="#37414f"/>

        <!-- ---------- 近侧曲柄 ---------- -->
        <g id="crankNear" transform="translate(420 366) rotate(0)">
          <line x1="0" y1="0" x2="28" y2="0" stroke="#8a94a3" stroke-width="7" stroke-linecap="round"/>
          <g id="pedalNear" transform="translate(28 0) rotate(0)">
            <rect x="-14" y="-4.5" width="28" height="9" rx="3.5" fill="#2b323b"/>
          </g>
        </g>

        <!-- ---------- 近侧腿（画在身体之前，大腿根部被身体盖住） ---------- -->
        <g>
          <path id="lntThighO" fill="none" stroke="#c9781f" stroke-width="31"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path id="lnsShinO"  fill="none" stroke="#c9781f" stroke-width="18"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path id="lntThighI" fill="none" stroke="#f7a94a" stroke-width="26"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path id="lnsShinI"  fill="none" stroke="#f7a94a" stroke-width="13"
                stroke-linecap="round" stroke-linejoin="round"/>
          <g id="footNear">
            <path d="M-15 2 C-14 -7 13 -8 16 2 C16 8 -8 9 -15 2 Z"
                  fill="#f7a94a" stroke="#d98a26" stroke-width="1.8" stroke-linejoin="round"/>
          </g>
        </g>

        <!-- ============ 鹈鹕 ============ -->
        <g id="pelican">

          <!-- 尾羽 -->
          <g id="tail" fill="#f3ecdd" stroke="#dcd3c0" stroke-width="2" stroke-linejoin="round">
            <path d="M356 200 C316 184 276 166 240 152 C268 180 292 202 308 222 Z"/>
            <path d="M356 208 C318 202 276 198 238 200 C274 214 300 226 312 236 Z"/>
            <path d="M354 214 C320 222 288 236 264 254 C296 250 324 242 346 232 Z"/>
          </g>

          <!-- 脖子 -->
          <path d="M452 202 C478 184 496 158 509 137" fill="none"
                stroke="#dcd3c0" stroke-width="48" stroke-linecap="round"/>
          <path d="M452 202 C478 184 496 158 509 137" fill="none"
                stroke="#fdfaf3" stroke-width="42" stroke-linecap="round"/>

          <!-- 身体 -->
          <ellipse cx="412" cy="212" rx="74" ry="56" transform="rotate(-12 412 212)"
                   fill="url(#bodyGrad)" stroke="#dcd3c0" stroke-width="2"/>

          <!-- 头部（整体下移一点，显得更像在骑车） -->
          <g transform="translate(0 14)">
            <g id="head">
              <!-- 冠羽 -->
              <path d="M498 98 C492 82 480 74 468 76 C477 84 486 94 492 106 Z"
                    fill="#f3ecdd" stroke="#dcd3c0" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="514" cy="116" r="28" fill="#fdfaf3" stroke="#dcd3c0" stroke-width="2"/>
              <!-- 喉囊 -->
              <g id="pouch">
                <path d="M538 104 C556 156 594 198 636 196 C660 192 674 168 676 128
                         C644 120 590 108 538 104 Z"
                      fill="url(#pouchGrad)" stroke="#d98a26" stroke-width="2.5" stroke-linejoin="round"/>
                <path d="M568 142 C588 166 612 182 642 184" fill="none"
                      stroke="#e0a052" stroke-width="2" stroke-linecap="round" opacity=".7"/>
              </g>
              <!-- 上喙 -->
              <path d="M524 96 C586 102 646 114 690 128 C664 142 600 140 548 130
                       C530 126 520 108 524 96 Z"
                    fill="url(#beakGrad)" stroke="#d98a26" stroke-width="2.5" stroke-linejoin="round"/>
              <path d="M540 106 C596 110 640 118 672 129" fill="none"
                    stroke="#ffe0a5" stroke-width="2" stroke-linecap="round" opacity=".8"/>
              <!-- 眼睛 -->
              <circle cx="518" cy="106" r="5.2" fill="#2b2f38"/>
              <circle cx="520" cy="104" r="1.9" fill="#ffffff"/>
            </g>
          </g>

          <!-- 翅膀（扶车把） -->
          <path d="M430 192 C456 188 490 198 520 212 C508 220 484 218 462 210
                   C442 203 426 198 430 192 Z"
                fill="#efe7d6" stroke="#dcd3c0" stroke-width="2" stroke-linejoin="round"/>
          <path id="wing"
                d="M424 184 C462 180 514 200 558 226 C566 231 561 241 548 239
                   C504 232 468 224 444 210 C428 200 418 188 424 184 Z"
                fill="#f8f2e6" stroke="#dcd3c0" stroke-width="2" stroke-linejoin="round"/>
          <g fill="none" stroke="#ece3cf" stroke-width="1.8" stroke-linecap="round">
            <path d="M504 208 C520 215 536 222 548 230"/>
            <path d="M526 218 C538 224 548 230 554 234"/>
          </g>
        </g>

      </g>
    </svg>
  </div>
  <div class="hint"><span class="dot"></span>SVG + requestAnimationFrame · 鹈鹕骑自行车</div>
</div>

<script>
(function () {
  "use strict";

  var NS = "http://www.w3.org/2000/svg";
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs) {
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  /* ---------------- 场景生成：云 / 灌木 / 路面虚线 ---------------- */

  // 云
  var cloudLayer = $("clouds");
  var clouds = [
    { x: 110, y: 96,  s: 1.00, sp: 9  },
    { x: 372, y: 60,  s: 0.72, sp: 6  },
    { x: 648, y: 128, s: 1.18, sp: 12 },
    { x: 884, y: 76,  s: 0.86, sp: 7  }
  ];
  clouds.forEach(function (c) {
    var g = el("g");
    g.appendChild(el("ellipse", { cx: 0,  cy: 0,   rx: 36, ry: 19 }));
    g.appendChild(el("circle",  { cx: -18, cy: -8,  r: 17 }));
    g.appendChild(el("circle",  { cx: 6,  cy: -15, r: 22 }));
    g.appendChild(el("circle",  { cx: 28, cy: -2,  r: 14 }));
    g.setAttribute("transform", "translate(" + c.x + " " + c.y + ") scale(" + c.s + ")");
    cloudLayer.appendChild(g);
    c.node = g;
  });

  // 路边灌木 / 树（周期 300，无缝滚动）
  var BUSH_PERIOD = 300;
  var bushLayer = $("bushes");
  for (var bx = -BUSH_PERIOD; bx <= 900 + BUSH_PERIOD; bx += BUSH_PERIOD) {
    var tile = el("g", { transform: "translate(" + bx + " 434)" });
    // 大树
    tile.appendChild(el("rect",   { x: -4, y: -46, width: 8, height: 48, rx: 3, fill: "#8a6a4c" }));
    tile.appendChild(el("circle", { cx: 0,   cy: -64, r: 28, fill: "#63b189" }));
    tile.appendChild(el("circle", { cx: -18, cy: -52, r: 17, fill: "#57a37e" }));
    tile.appendChild(el("circle", { cx: 17,  cy: -54, r: 16, fill: "#71bd95" }));
    // 矮灌木
    tile.appendChild(el("circle", { cx: 118, cy: -16, r: 17, fill: "#5fab83" }));
    tile.appendChild(el("circle", { cx: 133, cy: -11, r: 13, fill: "#6cba90" }));
    // 小树
    tile.appendChild(el("rect",   { x: 205, y: -28, width: 5,  height: 30, rx: 2.5, fill: "#8a6a4c" }));
    tile.appendChild(el("circle", { cx: 207.5, cy: -40, r: 19, fill: "#5aa77f" }));
    bushLayer.appendChild(tile);
  }

  // 路面虚线（周期 180）
  var DASH_PERIOD = 180;
  var dashLayer = $("dashes");
  for (var dx = -DASH_PERIOD; dx <= 900 + DASH_PERIOD; dx += DASH_PERIOD) {
    dashLayer.appendChild(el("rect", {
      x: dx + 10, y: 468, width: 92, height: 9, rx: 4.5,
      fill: "#eaf0f7", opacity: ".8"
    }));
  }

  /* ---------------- 运动学 ---------------- */

  var BB = { x: 420, y: 366 };        // 中轴
  var CRANK_R = 28;                   // 曲柄长度
  var HIP_N = { x: 404, y: 256 };     // 近侧髋
  var HIP_F = { x: 393, y: 252 };     // 远侧髋
  var L1 = 70, L2 = 78;               // 大腿 / 小腿

  var spinRear = $("spinRear"), spinFront = $("spinFront");
  var crankNear = $("crankNear"), crankFar = $("crankFar");
  var pedalNear = $("pedalNear"), pedalFar = $("pedalFar");
  var pelican = $("pelican"), pouch = $("pouch"), head = $("head"), wing = $("wing");
  var bushes = $("bushes"), dashes = $("dashes");

  var LEG_NEAR = {
    thighO: $("lntThighO"), shinO: $("lnsShinO"),
    thighI: $("lntThighI"), shinI: $("lnsShinI"),
    foot: $("footNear")
  };
  var LEG_FAR = {
    thighO: $("lftThighO"), shinO: $("lfsShinO"),
    thighI: $("lftThighI"), shinI: $("lfsShinI"),
    foot: $("footFar")
  };

  // 两段式反向运动学：返回膝盖坐标（膝盖朝前）
  function legIK(hip, foot) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d = Math.hypot(dx, dy) || 0.001;
    var dc = Math.min(d, L1 + L2 - 1.5);
    var ux = dx / d, uy = dy / d;
    var a = (L1 * L1 - L2 * L2 + dc * dc) / (2 * dc);
    var h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    var bx = hip.x + ux * a, by = hip.y + uy * a;
    return { kx: bx + uy * h, ky: by - ux * h };
  }

  function drawLeg(hip, foot, leg) {
    var k = legIK(hip, foot);
    var thigh = "M" + hip.x + " " + hip.y + "L" + k.kx + " " + k.ky;
    var shin  = "M" + k.kx + " " + k.ky + "L" + foot.x + " " + foot.y;
    leg.thighO.setAttribute("d", thigh);
    leg.thighI.setAttribute("d", thigh);
    leg.shinO.setAttribute("d", shin);
    leg.shinI.setAttribute("d", shin);
    leg.foot.setAttribute("transform", "translate(" + foot.x + " " + (foot.y - 7) + ")");
  }

  /* ---------------- 主循环 ---------------- */

  var CRANK_W = 5.4;   // 曲柄角速度 rad/s
  var WHEEL_W = 6.4;   // 车轮角速度 rad/s
  var ROAD_V  = 300;   // 路面线速度 px/s

  var last = 0;
  var crank = 0, wheel = 0, roadOff = 0, bushOff = 0;

  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    crank   += CRANK_W * dt;
    wheel   += WHEEL_W * dt;
    roadOff  = (roadOff + ROAD_V * dt) % DASH_PERIOD;
    bushOff  = (bushOff + ROAD_V * 0.5 * dt) % BUSH_PERIOD;

    // 身体起伏
    var bob  = Math.sin(crank * 2) * 2.2;
    var tilt = Math.sin(crank * 2 + 0.6) * 0.8;
    pelican.setAttribute("transform",
      "translate(0 " + bob.toFixed(2) + ") rotate(" + tilt.toFixed(2) + " 430 210)");

    // 头部轻微点头、喉囊晃动、翅膀微颤
    head.setAttribute("transform",
      "rotate(" + (Math.sin(crank * 2 + 1.6) * 1.6).toFixed(2) + " 500 130)");
    pouch.setAttribute("transform",
      "rotate(" + (Math.sin(crank * 2 - 0.4) * 2.4).toFixed(2) + " 560 130)");
    wing.setAttribute("transform",
      "rotate(" + (Math.sin(crank * 2 + 1.1) * 0.9).toFixed(2) + " 430 200)");

    // 车轮
    var wd = ((wheel * 180 / Math.PI) % 360).toFixed(2);
    spinRear.setAttribute("transform", "rotate(" + wd + ")");
    spinFront.setAttribute("transform", "rotate(" + wd + ")");

    // 曲柄
    var cd = crank * 180 / Math.PI;
    var c1 = (cd % 360).toFixed(2);
    var c2 = ((cd % 360) + 180).toFixed(2);
    crankNear.setAttribute("transform", "translate(420 366) rotate(" + c1 + ")");
    crankFar.setAttribute("transform",  "translate(420 366) rotate(" + c2 + ")");
    pedalNear.setAttribute("transform", "translate(28 0) rotate(" + (-cd % 360).toFixed(2) + ")");
    pedalFar.setAttribute("transform",  "translate(28 0) rotate(" + (-(cd + 180) % 360).toFixed(2) + ")");

    // 踏板位置
    var px = Math.cos(crank), py = Math.sin(crank);
    var pedalN = { x: BB.x + CRANK_R * px, y: BB.y + CRANK_R * py };
    var pedalF = { x: BB.x - CRANK_R * px, y: BB.y - CRANK_R * py };

    drawLeg({ x: HIP_N.x, y: HIP_N.y + bob }, pedalN, LEG_NEAR);
    drawLeg({ x: HIP_F.x, y: HIP_F.y + bob }, pedalF, LEG_FAR);

    // 视差滚动
    bushes.setAttribute("transform", "translate(" + (-bushOff).toFixed(2) + " 0)");
    dashes.setAttribute("transform", "translate(" + (-roadOff).toFixed(2) + " 0)");

    // 云飘动
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x -= c.sp * dt;
      if (c.x < -150) c.x = 1030;
      c.node.setAttribute("transform",
        "translate(" + c.x.toFixed(1) + " " + c.y + ") scale(" + c.s + ")");
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
